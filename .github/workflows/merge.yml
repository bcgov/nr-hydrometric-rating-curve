name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/*"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: test-prod
  cancel-in-progress: false
      
permissions: {}

jobs:
  vars:
    name: Set Variables
    outputs:
      fork: ${{ steps.source.outputs.fork }}
      # Internal merge: the PR whose image image-tracker resolved (may be an older PR on a
      # docs-only merge - that's the promotion-correct answer). Fork merge: the merged PR,
      # whose number the rebuild below is tagged with.
      pr: ${{ steps.source.outputs.fork == 'true' && steps.source.outputs.pr || steps.tracker.outputs.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      # Fork runners get a read-only token and publish to the fork's GHCR, so a fork
      # merge has no trusted :PR# image in ghcr.io/bcgov to promote (see issue #386).
      - name: Detect fork merge
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pulls=$(gh api "repos/${REPO}/commits/${{ github.sha }}/pulls")
          is_fork='((.head.repo.full_name // "") | ascii_downcase) != ($repo | ascii_downcase)'
          fork=$(jq -r --arg repo "$REPO" "[.[] | ${is_fork}] | any" <<<"$pulls")
          # Prefer the fork PR's number if several PRs share the commit (cherry-picks),
          # so the rebuild never overwrites an internal PR's :PR# tag.
          pr=$(jq -r --arg repo "$REPO" "(map(select(${is_fork})) + .) | .[0].number // empty" <<<"$pulls")
          {
            echo "fork=${fork:-false}"
            echo "pr=${pr}"
          } | tee -a "$GITHUB_OUTPUT"

      # Resolve PR number and images for squash merges to main
      - name: Resolve Images & PR
        if: steps.source.outputs.fork != 'true'
        id: tracker
        uses: bcgov/actions/image-tracker@ac9d89eede94f5f58d3446784c94cff634d98eac # v0.6.0
        with:
          package: frontend, rctool
          max_depth: 100

  # Fork merge only: rebuild from reviewed main, tagged with the PR number so it
  # looks like any other PR build and flows through deploy/promote unchanged.
  builds:
    name: Builds (fork merge)
    needs: [vars]
    if: needs.vars.outputs.fork == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [frontend, rctool]
        include:
          - package: frontend
            build_file: ./frontend/Dockerfile.nginx
          - package: rctool
            build_file: ./frontend/Dockerfile.app
    steps:
      - uses: bcgov/actions/builder@ac9d89eede94f5f58d3446784c94cff634d98eac # v0.6.0
        with:
          package: ${{ matrix.package }}
          build_file: ${{ matrix.build_file }}
          build_context: ./frontend
          tags: ${{ needs.vars.outputs.pr }}
          tag_fallback: test
          # Diff against main as it was before this push. builder's default ref is the
          # default branch (diffs main against itself, never fires); HEAD^ would miss all
          # but the last commit of a rebase merge.
          ref: ${{ github.event.before || 'HEAD^' }}
          triggers: |
            frontend/

  deploy-test:
    name: Deploy (TEST)
    needs: [vars, builds]
    # builds is skipped on internal merges; don't let that skip the deploy
    if: ${{ !cancelled() && needs.vars.result == 'success' && needs.builds.result != 'failure' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/.deployer.yml
    secrets:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      environment: test
      tag: ${{ needs.vars.outputs.pr }}
      params: --set global.autoscaling=true --set rctool.pdb.enabled=true --set frontend.pdb.enabled=true --set-string frontend.gunicorn.logLevel=debug

  promote-test:
    name: Promote Images
    needs: [deploy-test, vars]
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [frontend, rctool]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          tags: test
          target: ${{ needs.vars.outputs.pr }}

