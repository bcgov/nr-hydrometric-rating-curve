name: PR Closed

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup and Images
    # Skip cleanup for fork PRs targeting upstream where repository secrets are stripped
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      packages: write
    uses: bcgov/actions-openshift/.github/workflows/.pr-close.yml@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
    secrets:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      cleanup: helm
      packages: |
        frontend
        rctool
