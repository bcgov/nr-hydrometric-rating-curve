name: PR Closed

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup and Images
    # Skip cleanup for fork PRs targeting upstream where repository secrets are stripped
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      packages: write
    uses: bcgov/actions-openshift/.github/workflows/.pr-close.yml@b2757e12d08b7d3bf2c5df7cd58b4cdaf6b3ea71 # v0.11.1
    secrets:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      cleanup: helm
      packages: |
        frontend
        rctool
