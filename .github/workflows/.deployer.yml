name: Helm Deployer

on:
  workflow_call:
    inputs:
      ### Required
      # Only secrets!

      ### Typical / recommended
      environment:
        description: Environment name; omit for PRs
        required: false
        type: string
      oc_server:
        default: https://api.silver.devops.gov.bc.ca:6443
        description: 'OpenShift server'
        required: false
        type: string
      params:
        description: 'Extra parameters to pass to helm upgrade'
        default: ''
        required: false
        type: string
      tag:
        description: Specify a tag to deploy; defaults to PR head SHA on pull_request, else PR number
        required: false
        type: string
      triggers:
        description: Paths used to trigger a deployment; e.g. ('./backend/' './frontend/'')
        required: false
        type: string

    outputs:
      triggered:
        description: 'Has a deployment has been triggered?'
        value: ${{ jobs.deploy.outputs.triggered }}

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Helm
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.vars.outputs.packages }}
      tag: ${{ steps.vars.outputs.tag }}
      triggered: ${{ steps.finalize.outputs.triggered }}
    steps:
      - name: Deploy eligibility
        id: gate
        run: |
          if [ -z "${{ secrets.oc_token }}" ] || [ -z "${{ secrets.oc_namespace }}" ]; then
            echo "::notice::OpenShift credentials unavailable; deploy skipped (expected on fork PRs)."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      ### Triggers, tag and release

      # Variables
      - if: inputs.tag  == ''
        id: pr
        uses: bcgov/actions/get-pr@main # beta: revert to release pin in #380

      - name: Vars
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ steps.pr.outputs.pr }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          # GHCR path: fork PR images live under head.repo (same as builder-ghcr publish_repository).
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${HEAD_REPO}" ]; then
            repository="${HEAD_REPO,,}"
          else
            repository="${GH_REPOSITORY,,}"
          fi

          # Tag: explicit input, else PR head SHA (builder always tags this), else PR number (merge/deploy).
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          elif [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${HEAD_SHA}" ]; then
            tag="${HEAD_SHA}"
          else
            tag="${PR_NUMBER}"
          fi

          release="${REPO_NAME}-${ENVIRONMENT:-${INPUT_TAG:-${PR_NUMBER}}}"
          version="1.0.0-${RUN_NUMBER}"

          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${HEAD_REPO}" ] && [ "${HEAD_REPO,,}" != "${GH_REPOSITORY,,}" ]; then
            echo "::notice::Deploying fork images from ghcr.io/${repository} (tag ${tag}). Images must be public and published by a prior push to the fork."
          fi

          echo "repository=${repository}"
          echo "tag=${tag}"
          echo "release=${release}"
          echo "version=${version}"

          {
            echo "repository=${repository}"
            echo "tag=${tag}"
            echo "release=${release}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      ### Deploy
      - name: Interrupt deployments (PR only)
        if: steps.gate.outputs.eligible == 'true' && github.event_name == 'pull_request'
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ inputs.oc_server }}
          triggers: ${{ inputs.triggers }}
          commands: |
            # Interrupt any previous deployments (PR only)
            PREVIOUS=$(helm status ${{ steps.vars.outputs.release }} -o json | jq .info.status || true)
            if [[ ${PREVIOUS} =~ pending ]]; then
              echo "Rollback triggered"
              helm rollback ${{ steps.vars.outputs.release }} || \
                helm uninstall ${{ steps.vars.outputs.release }}
            fi

      - name: Deploy Helm chart
        id: deploy
        if: steps.gate.outputs.eligible == 'true'
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ inputs.oc_server }}
          triggers: ${{ inputs.triggers }}
          commands: |
            # Package Helm chart
            cd charts/app
            sed -i 's/^name:.*/name: ${{ github.event.repository.name }}/' Chart.yaml
            helm package -u . --app-version="tag-${{ steps.vars.outputs.tag }}_run-${{ github.run_number }}" \
              --version=${{ steps.pr.outputs.pr || steps.vars.outputs.version }}

            # Helm upgrade/rollout
            helm upgrade \
              --set-string global.repository=${{ steps.vars.outputs.repository }} \
              --set-string global.tag=${{ steps.vars.outputs.tag }} \
              ${{ inputs.params }} \
              --install --wait '--atomic' \
              ${{ steps.vars.outputs.release }} \
              --timeout 10m \
              --values values.yaml \
              ./${{ github.event.repository.name }}-${{ steps.pr.outputs.pr || steps.vars.outputs.version }}.tgz

            # Helm release history
            helm history ${{ steps.vars.outputs.release }}

            # Completed pod cleanup
            oc delete po --field-selector=status.phase==Succeeded || true

      - name: Finalize deploy triggered output
        id: finalize
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.eligible }}" != "true" ]; then
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=${{ steps.deploy.outputs.triggered || 'true' }}" >> "$GITHUB_OUTPUT"
          fi
