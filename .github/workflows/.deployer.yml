name: Helm Deployer

on:
  workflow_call:
    inputs:
      ### Required
      # Only secrets!

      ### Typical / recommended
      environment:
        description: Environment name; omit for PRs
        required: false
        type: string
      oc_server:
        default: https://api.silver.devops.gov.bc.ca:6443
        description: 'OpenShift server'
        required: false
        type: string
      params:
        description: 'Extra parameters to pass to helm upgrade'
        default: ''
        required: false
        type: string
      tag:
        description: Specify a tag to deploy; defaults to PR head SHA, else PR number
        required: false
        type: string
      triggers:
        description: Paths used to trigger a deployment; e.g. ('./backend/' './frontend/'')
        required: false
        type: string

    outputs:
      triggered:
        description: 'Has a deployment has been triggered?'
        value: ${{ jobs.deploy.outputs.triggered }}

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Helm
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.vars.outputs.packages }}
      tag: ${{ steps.vars.outputs.tag }}
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      ### Triggers, tag and release

      - name: Vars
        id: vars
        run: |
          # Tag: explicit input, else PR head SHA (always tagged by builder), else PR number
          tag="${{ inputs.tag || github.event.pull_request.head.sha || github.event.number }}"
          repository=$(echo '${{ github.event.pull_request.head.repo.full_name || github.repository }}' | tr '[:upper:]' '[:lower:]')

          # Release name includes run numbers to ensure uniqueness
          release="${{ github.event.repository.name }}-${{ inputs.environment || inputs.tag || github.event.number }}"

          # Version, used for non-PR releases
          version="1.0.0-${{ github.run_number }}"

          # Chart version: PR number for PR builds, else input tag, else run-based version
          chart_version="${{ github.event.number || inputs.tag || '' }}"
          [ -z "$chart_version" ] && chart_version="${version}"

          # Summary
          echo "tag=${tag}"
          echo "repository=${repository}"
          echo "release=${release}"
          echo "version=${version}"
          echo "chart_version=${chart_version}"

          # Output
          {
            echo "tag=${tag}"
            echo "repository=${repository}"
            echo "release=${release}"
            echo "version=${version}"
            echo "chart_version=${chart_version}"
          } >> "$GITHUB_OUTPUT"

      # image-tracker needs a git checkout to resolve revision; skip on merge/release
      # (those deploy by PR/release tag, not commit SHA)
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - name: Resolve images
        id: tracker
        if: github.event_name == 'pull_request'
        uses: bcgov/actions/image-tracker@main # beta: revert to release pin in #380
        with:
          package: frontend, rctool
          repository: ${{ steps.vars.outputs.repository }}
          revision: ${{ github.event.pull_request.head.sha }}

      ### Deploy
      - name: Interrupt deployments (PR only)
        if: github.event_name == 'pull_request' && steps.tracker.outputs.digest != ''
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ inputs.oc_server }}
          triggers: ${{ inputs.triggers }}
          commands: |
            # Interrupt any previous deployments (PR only)
            PREVIOUS=$(helm status ${{ steps.vars.outputs.release }} -o json | jq .info.status || true)
            if [[ ${PREVIOUS} =~ pending ]]; then
              echo "Rollback triggered"
              helm rollback ${{ steps.vars.outputs.release }} || \
                helm uninstall ${{ steps.vars.outputs.release }}
            fi

      - name: Deploy Helm chart
        id: deploy
        if: github.event_name != 'pull_request' || steps.tracker.outputs.digest != ''
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ inputs.oc_server }}
          triggers: ${{ inputs.triggers }}
          commands: |
            # Package Helm chart
            cd charts/app
            sed -i 's/^name:.*/name: ${{ github.event.repository.name }}/' Chart.yaml
            helm package -u . --app-version="tag-${{ steps.vars.outputs.tag }}_run-${{ github.run_number }}" \
              --version=${{ steps.vars.outputs.chart_version }}

            # Helm upgrade/rollout
            helm upgrade \
              --set-string global.repository=${{ steps.vars.outputs.repository }} \
              --set-string global.tag=${{ steps.vars.outputs.tag }} \
              ${{ inputs.params }} \
              --install --wait '--atomic' \
              ${{ steps.vars.outputs.release }} \
              --timeout 10m \
              --values values.yaml \
              ./${{ github.event.repository.name }}-${{ steps.vars.outputs.chart_version }}.tgz

            # Helm release history
            helm history ${{ steps.vars.outputs.release }}

            # Completed pod cleanup
            oc delete po --field-selector=status.phase==Succeeded || true
