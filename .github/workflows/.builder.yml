name: Image Builder

on:
  workflow_call:
    inputs:
      ### Optional
      tags:
        description: 'Image tag(s)'
        default: ${{ github.event.number }}
        type: string
      tag_fallback:
        description: 'Tag to retag when no build is triggered'
        default: test
        type: string
      triggers:
        description: 'Paths that trigger a build; omit to always build'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [frontend, rctool]
        include:
          - package: frontend
            build_file: ./frontend/Dockerfile.nginx
          - package: rctool
            build_file: ./frontend/Dockerfile.app
    steps:
      - uses: bcgov/actions/builder@ac9d89eede94f5f58d3446784c94cff634d98eac # v0.6.0
        with:
          package: ${{ matrix.package }}
          build_file: ${{ matrix.build_file }}
          build_context: ./frontend
          tags: ${{ inputs.tags }}
          tag_fallback: ${{ inputs.tag_fallback }}
          triggers: ${{ inputs.triggers }}
          metadata_flavor: |
            latest=false
          metadata_tag_rules: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

