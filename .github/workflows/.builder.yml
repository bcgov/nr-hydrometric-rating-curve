name: Image Builder

on:
  workflow_call:
    inputs:
      ### Optional
      tags:
        description: 'Image tag(s)'
        default: ${{ github.event.number }}
        type: string
      tag_fallback:
        description: 'Tag to retag when no build is triggered'
        default: latest
        type: string
      triggers:
        description: 'Paths that trigger a build; omit to always build'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [frontend, rctool]
        include:
          - package: frontend
            build_file: ./frontend/Dockerfile.nginx
          - package: rctool
            build_file: ./frontend/Dockerfile.app
    steps:
      - uses: bcgov/actions/builder@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          package: ${{ matrix.package }}
          build_file: ${{ matrix.build_file }}
          build_context: ./frontend
          tags: ${{ inputs.tags }}
          tag_fallback: ${{ inputs.tag_fallback }}
          triggers: ${{ inputs.triggers }}

