[pytest]
DJANGO_SETTINGS_MODULE = rctool_project.test_settings
python_files = tests.py test_*.py
python_classes = Test* *TestCase
python_functions = test_*
testpaths = .
markers =
    playwright: browser-driven end-to-end test (requires `playwright install chromium`); excluded from the default run, opt in with `pytest -m playwright`
addopts = --cov=rctool --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -m "not playwright"
